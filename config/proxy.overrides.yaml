- anchor: '  host: ""'
  replace: true
  content: '  host: "127.0.0.1"'
- anchor: |2-
      api-keys:
        - "your-api-key-1"
        - "your-api-key-2"
        - "your-api-key-3"
  replace: true
  content: "  api-keys: []"
- anchor: '  #         - ''input.#(type=="additional_tools")#.tools.#(name=="functions")#.tools.#(name=="apply_patch")#'''
  content: |2-
      payload:
        override:
          # @glm-overrides
        filter:
          - models:
              - name: github_copilot/gpt-*
                protocol: codex
            params:
              - 'input.#(type=="reasoning" && encrypted_content%"gAAAA*")#'
              - 'input.#(type=="reasoning" && encrypted_content%"rsn_*")#'
              - 'input.#(type=="reasoning" && encrypted_content%"smry_*")#'
              - 'input.#(type=="message")#.id'
              - 'input.#(type=="function_call")#.id'
              - 'input.#(type=="custom_tool_call")#.id'
          - models:
              - name: gpt-*
                protocol: codex
            params:
              - 'input.#(type=="reasoning" && encrypted_content%"?*" && encrypted_content!%"gAAAA*" && encrypted_content!%"rsn_*" && encrypted_content!%"smry_*")#'
- anchor: |-
    #         - name: "kimi-k2.5"
    #           alias: "claude-opus-4.66"
  content: |-
    api-keys:
      claude:
        - name: zai
          base-url: https://api.z.ai/api/anthropic
          models:
            # @zai-models
          keys:
            - api-key: __ZAI_API_KEY__
- anchor: '  #       alias: "sample-latest"'
  content: |2-
      model-alias:
        codex:
          # @codex-aliases
- anchor: "  #       max-context-length: 1048576"
