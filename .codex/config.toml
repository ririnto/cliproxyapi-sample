approval_policy = "never"
model = "gpt-6.1-sol"
model_catalog_json = "models.json"
model_reasoning_effort = "medium"
model_verbosity = "low"
openai_base_url = "http://localhost:8317/v1"
personality = "none"
plan_mode_reasoning_effort = "high"
review_model = "gpt-6-luna"
sandbox_mode = "danger-full-access"
service_tier = "default"

[agents]
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 8

[features]
fast_mode = false
local_thread_store_compression = true
memories = true
prevent_idle_sleep = true

[features.code_mode]
default_exec_yield_time_ms = 240000

[features.context_management]
experimental_mode = true

[features.multi_agent_v2]
default_wait_timeout_ms = 240000
enabled = true
hide_spawn_agent_metadata = false
min_wait_timeout_ms = 120000
tool_namespace = "agents"

[marketplaces.sinon]
ref = "main"
source = "https://github.com/ririnto/sinon.git"
source_type = "git"

[mcp_servers.context7]
bearer_token_env_var = "CONTEXT7_API_KEY"
url = "https://mcp.context7.com/mcp"

[mcp_servers.grep_app]
url = "https://mcp.grep.app"

[memories]
extract_model = "gpt-6-luna"
consolidation_model = "gpt-6-luna"

[notice]
fast_default_opt_out = true
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "permissions",
  "context-remaining"
]
