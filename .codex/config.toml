approval_policy = "never"
approvals_reviewer = "auto_review"
model = "gpt-6.1-terra"
model_catalog_json = "model_catalog.json"
model_reasoning_effort = "high"
model_verbosity = "low"
openai_base_url = "http://localhost:8317/v1"
personality = "none"
sandbox_mode = "danger-full-access"
service_tier = "default"

[agents]
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 12

[features.code_mode]
default_exec_yield_time_ms = 270000

[features.context_management]
experimental_mode = true

[features.multi_agent_v2]
default_wait_timeout_ms = 270000
enabled = true
hide_spawn_agent_metadata = false
min_wait_timeout_ms = 120000
tool_namespace = "agents"

[features]
fast_mode = false
local_thread_store_compression = true
memories = true
prevent_idle_sleep = true

[marketplaces.agent-browser]
source = "https://github.com/vercel-labs/agent-browser.git"
source_type = "git"

[marketplaces.cursor-plugins]
source = "https://github.com/cursor/plugins.git"
source_type = "git"

[marketplaces.googlechrome]
source = "https://github.com/GoogleChrome/modern-web-guidance.git"
source_type = "git"

[marketplaces.i-have-adhd]
source = "https://github.com/ayghri/i-have-adhd.git"
source_type = "git"

[marketplaces.rea]
source = "https://github.com/morluto/rea.git"
source_type = "git"

[marketplaces.sinon]
source = "https://github.com/ririnto/sinon.git"
source_type = "git"

[marketplaces.superpowers-marketplace]
source = "https://github.com/obra/superpowers-marketplace.git"
source_type = "git"

[mcp_servers.context7]
bearer_token_env_var = "CONTEXT7_API_KEY"
url = "https://mcp.context7.com/mcp"

[mcp_servers.grep_app]
url = "https://mcp.grep.app"

[memories]
consolidation_model = "gpt-6.1-terra"
extract_model = "gpt-6-luna"

[notice]
fast_default_opt_out = true
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[plugins."agent-browser@agent-browser"]
enabled = true

[plugins."agent-desktop-plugin@sinon"]
enabled = true

[plugins."clear-writing@sinon"]
enabled = true

[plugins."codegraph-plugin@sinon"]
enabled = true

[plugins."ddgs-plugin@sinon"]
enabled = true

[plugins."i-have-adhd@i-have-adhd"]
enabled = true

[plugins."modern-web-guidance@googlechrome"]
enabled = true

[plugins."pstack@cursor-plugins"]
enabled = true

[plugins."rea@rea"]
enabled = true

[plugins."stop-slop@sinon"]
enabled = true

[plugins."superpowers@superpowers-marketplace"]
enabled = true

[plugins."workgraph@sinon"]
enabled = true

[tui]
status_line = [
  "model-with-reasoning",
  "project-name",
  "git-branch",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "used-tokens"
]
status_line_use_colors = true
