#:schema https://developers.openai.com/codex/config-schema.json
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = ":danger-full-access"
model = "gpt-6.2-sol"
model_catalog_json = "model_catalog.json"
model_provider = "openai"
model_reasoning_effort = "high"
openai_base_url = "http://localhost:8317/v1"
project_doc_fallback_filenames = ["CLAUDE.md", "GEMINI.md"]
sandbox_mode = "danger-full-access"
show_raw_agent_reasoning = true

[agents]
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 12

[apps._default]
default_tools_approval_mode = "approve"

[features]
fast_mode = false
image_generation = false
local_thread_store_compression = true
login_shell_package_path = true
memories = true
prevent_idle_sleep = true
tui_extensions_statusline = true

[features.code_mode]
default_exec_yield_time_ms = 270000

[features.context_management]
experimental_mode = true

[features.multi_agent_v2]
default_wait_timeout_ms = 270000
enabled = true
hide_spawn_agent_metadata = false
min_wait_timeout_ms = 120000
tool_namespace = "agents"

[marketplaces.cursor-plugins]
ref = "main"
source = "https://github.com/cursor/plugins.git"
source_type = "git"

[marketplaces.googlechrome]
ref = "main"
source = "https://github.com/GoogleChrome/modern-web-guidance.git"
source_type = "git"

[marketplaces.grafana-skills]
ref = "main"
source = "https://github.com/grafana/skills.git"
source_type = "git"

[marketplaces.i-have-adhd]
ref = "main"
source = "https://github.com/ayghri/i-have-adhd.git"
source_type = "git"

[marketplaces.kotest]
ref = "master"
source = "https://github.com/kotest/kotest.git"
source_type = "git"

[marketplaces.rea]
ref = "main"
source = "https://github.com/morluto/rea.git"
source_type = "git"

[marketplaces.sinon]
ref = "main"
source = "https://github.com/ririnto/sinon.git"
source_type = "git"

[marketplaces.superpowers-marketplace]
ref = "main"
source = "https://github.com/obra/superpowers-marketplace.git"
source_type = "git"

[mcp_servers.context7]
bearer_token_env_var = "CONTEXT7_API_KEY"
url = "https://mcp.context7.com/mcp"

[mcp_servers.grep_app]
url = "https://mcp.grep.app"

[memories]
consolidation_model = "gpt-6.1-terra"
disable_on_external_context = true
extract_model = "gpt-6-luna"

[model_providers.openai]

[notice]
fast_default_opt_out = true
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[plugins."agent-browser-plugin@sinon"]
enabled = true

[plugins."agent-desktop-plugin@sinon"]
enabled = true

[plugins."clear-writing@sinon"]
enabled = true

[plugins."codegraph-plugin@sinon"]
enabled = true

[plugins."ddgs-plugin@sinon"]
enabled = true

[plugins."grafana-core@grafana-skills"]
enabled = true

[plugins."i-have-adhd@i-have-adhd"]
enabled = true

[plugins."kotest-skills@kotest"]
enabled = true

[plugins."modern-web-guidance@googlechrome"]
enabled = true

[plugins."pstack@cursor-plugins"]
enabled = true

[plugins."rea@rea"]
enabled = true

[plugins."stop-slop@sinon"]
enabled = true

[plugins."workgraph@sinon"]
enabled = true

[plugins."superpowers@superpowers-marketplace"]
enabled = true

[sandbox_workspace_write]
network_access = true

[tools.experimental_request_user_input]
enabled = true

[tools.update_plan]
enabled = true

[tui]
resume_cwd = "session"
status_line = [
  "model-with-reasoning",
  "project-name",
  "git-branch",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "used-tokens"
]
status_line_use_colors = true
