- anchor: '  host: ""'
  comment: true
  insert: '  host: "127.0.0.1"'
- anchor: |2-
      api-keys:
        - "your-api-key-1"
        - "your-api-key-2"
        - "your-api-key-3"
  comment: true
  insert: "  api-keys: []"
- anchor: "  session-affinity: false # default: false"
  comment: true
  insert: "  session-affinity: true"
- anchor: '  session-affinity-ttl: "1h"'
  comment: true
  insert: '  session-affinity-ttl: "24h"'
- anchor: '  #         - ''input.#(type=="additional_tools")#.tools.#(name=="functions")#.tools.#(name=="apply_patch")#'''
  insert: |2-
      payload:
        override:
          # @glm-overrides
        filter:
          - models:
              - name: github_copilot/gpt-*
                protocol: codex
            params:
              - 'input.#(type=="reasoning" && encrypted_content%"gAAAA*")#'
              - 'input.#(type=="reasoning" && encrypted_content%"rsn_*")#'
              - 'input.#(type=="reasoning" && encrypted_content%"smry_*")#'
              - 'input.#(type=="compaction" && encrypted_content%"gAAAA*")#'
              - 'input.#(type=="compaction" && encrypted_content%"rsn_*")#'
              - 'input.#(type=="compaction" && encrypted_content%"smry_*")#'
              - 'input.#(type=="message")#.id'
              - 'input.#(type=="function_call")#.id'
              - 'input.#(type=="custom_tool_call")#.id'
          - models:
              - name: openai/gpt-*
                protocol: codex
            params:
              - 'input.#(type=="reasoning" && encrypted_content%"?*" && encrypted_content!%"gAAAA*" && encrypted_content!%"rsn_*" && encrypted_content!%"smry_*")#'
              - 'input.#(type=="compaction" && encrypted_content%"?*" && encrypted_content!%"gAAAA*" && encrypted_content!%"rsn_*" && encrypted_content!%"smry_*")#'
