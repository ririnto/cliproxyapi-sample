name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Install CLIProxyAPI for routing tests
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo cliproxy.tar.gz https://github.com/router-for-me/CLIProxyAPI/releases/download/v8.0.77/CLIProxyAPI_8.0.77_linux_amd64.tar.gz
          echo '1a7ea3f968c414ed9839facfdb1c0efe34cf3038b75b2e118db143d04de1aeb3  cliproxy.tar.gz' | sha256sum --check
          tar -xzf cliproxy.tar.gz cli-proxy-api
          echo "CLIPROXYAPI_TEST_BINARY=$RUNNER_TEMP/cli-proxy-api" >> "$GITHUB_ENV"
      - run: pnpm run pre-push
      - run: docker compose -f compose.yaml config --quiet
