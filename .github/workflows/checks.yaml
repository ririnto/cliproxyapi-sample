name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pre-push
      - run: docker compose -f compose.yaml config --quiet
